apiVersion: v1
kind: ConfigMap
metadata:
  name: task-management-config
  namespace: tasks
data:
  APP_NAME: "Task Management API"
  APP_VERSION: "1.0.0"

  # Authentication - set to "true" to disable JWT enforcement entirely.
  AUTH_DISABLED: "false"

  # External IdP configuration - replace with your IdP's actual issuer,
  # audience and JWKS endpoint.
  JWT_ISSUER: "https://idp.example.com/"
  JWT_AUDIENCE: "task-management-api"
  JWT_JWK_URL: "https://idp.example.com/.well-known/jwks.json"
